[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sqtrack"
version = "0.1.0"
description = "Mesoscale squall line feature tracking with parent-inheritance merge logic"
readme = "README.md"
authors = [{ name = "DIONG JEONG YIK", email = "edwarddiong@gmail.com" }]
license = { text = "MIT" }
dependencies = [
    "numpy",
    "pandas",
    "xarray",
    "geopandas",
    "shapely",
    "scikit-image",
    "scipy",
    "matplotlib"
]

[project.urls]
Homepage = "https://github.com/JYDiong/sqtrack"
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sqtrack"
version = "0.1.1"
description = "Mesoscale squall line feature tracking with graph-based tracking"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "DIONG JEONG YIK", email = "edwarddiong@gmail.com" }]
license = { text = "MIT" }
dependencies = [
    "numpy",
    "pandas",
    "xarray",
    "geopandas",
    "shapely",
    "scikit-image",
    "scipy",
    "matplotlib",
    "networkx"
]

[project.urls]
Homepage = "https://github.com/JYDiong/sqtrack"

[tool.setuptools.packages.find]
where = ["."]
include = ["sqtrack*"]